name: Deploy

# Trigger: only when backend code changes on main branch
on:
  push:
    branches: [main]
    paths:
      - 'backend/**'

env:
  AWS_REGION: eu-central-1
  ECR_REPOSITORY: pixora-backend
  EKS_CLUSTER: pixora-eks

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Pull the repository code into the GitHub Actions runner
      - name: Checkout
        uses: actions/checkout@v4

      # Authenticate GitHub Actions runner with AWS using stored secrets
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      # Get a temporary ECR auth token so Docker can push images
      - name: Login to ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      # Build for linux/amd64 (required for EKS nodes, not Mac ARM)
      # Tag with commit SHA for traceability and latest for convenience
      # Push both tags to ECR
      - name: Build and push image
        id: build
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker build --platform linux/amd64 \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:latest \
            ./backend
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG
          docker push $ECR_REGISTRY/$ECR_REPOSITORY:latest
          echo "image=$ECR_REGISTRY/$ECR_REPOSITORY:$IMAGE_TAG" >> $GITHUB_OUTPUT

      # Configure kubectl to talk to our EKS cluster
      # Update the deployment with the new image (commit SHA tag)
      # Wait until rollout completes before marking the job as successful
      - name: Deploy to EKS
        env:
          IMAGE: ${{ steps.build.outputs.image }}
        run: |
          aws eks update-kubeconfig --region $AWS_REGION --name $EKS_CLUSTER
          kubectl set image deployment/pixora-backend pixora-backend=$IMAGE
          kubectl rollout status deployment/pixora-backend --timeout=120s