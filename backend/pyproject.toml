[project]
name = "backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "bcrypt==4.0.1",
    "boto3>=1.43.6",
    "email-validator>=2.3.0",
    "fastapi>=0.136.1",
    "passlib[bcrypt]==1.7.4",
    "pydantic-settings>=2.14.1",
